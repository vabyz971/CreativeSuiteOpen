[workspace]
resolver = "2"
members = [
    "core/core",
    "core/datatypes",
    "engines/photo-engine",
    "engines/video-engine",
    "engines/audio-engine",
    "packages/ui-kit",
    "packages/math-utils",
    "packages/file-utils",
    "packages/preferences",
    "apps/photo",
    "apps/video",
    "apps/audio",
]

[workspace.dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "drop_down", "menu", "color_picker"] }
wgpu = "30.0.0"
image = { version = "0.25", features = ["rayon"] }
rayon = "1.10"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
log = "0.4"
dirs = "6"
