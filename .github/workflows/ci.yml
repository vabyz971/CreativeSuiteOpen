# CreativeSuiteOpen — CI minimale
# fmt → clippy → tests, sur la plateforme de référence (Linux/Vulkan).
# C'est le garde-fou principal du repo (pas de hooks locaux partagés).

name: CI

on:
  push:
    branches: [main, photo]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (wgpu/iced sur Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev

      - name: Toolchain Rust stable (édition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (erreurs = échec)
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace
